<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Chiroptera Members</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.8)),
url("assets/background.jpg");

background-size:cover;
background-position:center;

height:100vh;

overflow:hidden;

color:#e9d3a4;

}

.fog{

position:absolute;

width:250%;

height:250%;

background:url("https://i.imgur.com/OZaT7jl.png");

opacity:.18;

animation:fog 60s linear infinite;

}

@keyframes fog{

0%{

transform:translateX(-30%);

}

100%{

transform:translateX(0);

}

}

.container{

position:relative;

z-index:2;

text-align:center;

padding-top:70px;

}

h1{

font-size:70px;

letter-spacing:6px;

text-shadow:0 0 25px gold;

margin-bottom:15px;

}

.wallet{

font-size:22px;

margin-top:20px;

color:#d9b66b;

}

.card{

width:750px;

max-width:95%;

margin:40px auto;

background:rgba(0,0,0,.55);

border:2px solid #c79b46;

border-radius:18px;

padding:35px;

backdrop-filter:blur(10px);

box-shadow:0 0 35px rgba(255,215,0,.2);

}

.menu{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-top:35px;

}

.item{

padding:20px;

border:1px solid #b88b3b;

border-radius:12px;

cursor:pointer;

transition:.35s;

font-size:24px;

}

.item:hover{

background:#b88b3b;

color:black;

transform:scale(1.05);

box-shadow:0 0 30px gold;

}

.footer{

position:absolute;

bottom:25px;

width:100%;

text-align:center;

font-size:18px;

color:#888;

}

</style>

</head>

<body>

<div class="fog"></div>

<div class="container">

<h1>CHIROPTERA</h1>

<h2>MEMBERS CAVE</h2>

<div class="wallet">

Wallet Verified ✓

</div>

<div class="card">

<h2>Exclusive Holder Area</h2>

<p style="margin-top:20px;font-size:20px">

Only verified NFT holders have access to this chamber.

</p>

<div class="menu">

<div class="item">🎁 Rewards</div>

<div class="item">🗳 DAO</div>

<div class="item">🎨 Gallery</div>

<div class="item">💬 Discord</div>

<div class="item">📜 Lore</div>

<div class="item">⚙ Settings</div>

</div>

</div>

</div>

<div class="footer">

© Chiroptera NFT Collection

</div>

</body>
</html>
