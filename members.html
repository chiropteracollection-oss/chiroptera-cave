<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chiroptera Members</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia,serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.8)),
url("assets/background.jpg");

background-size:cover;
background-position:center;

min-height:100vh;

color:#e8d2a3;

display:flex;
justify-content:center;
align-items:center;

}

.card{

width:900px;
max-width:95%;

background:rgba(0,0,0,.55);

backdrop-filter:blur(12px);

border:2px solid #c89a49;

border-radius:18px;

padding:40px;

box-shadow:0 0 40px rgba(255,215,0,.15);

}

h1{

font-size:56px;
text-align:center;
margin-bottom:15px;

}

#wallet{

text-align:center;

font-size:20px;

margin-bottom:35px;

color:#d4b06b;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.box{

padding:22px;

border:1px solid #c89a49;

border-radius:12px;

text-align:center;

font-size:24px;

transition:.3s;

cursor:pointer;

}

.box:hover{

background:#c89a49;

color:black;

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="card">

<h1>CHIROPTERA MEMBERS</h1>

<div id="wallet">

Checking wallet...

</div>

<div class="grid">

<div class="box" onclick="location.href='rewards.html'">
    🎁 Rewards
</div>

<div class="box" onclick="location.href='dao.html'">
🗳 DAO
</div>

<div class="box">🎨 Gallery</div>

<div class="box">💬 Discord</div>

<div class="box" onclick="location.href='lore.html'">
📜 Lore
</div>

<div class="box">⚙ Settings</div>

</div>

</div>

<script>

const CONTRACT="0xe55d8a7f9aaed7919e6a6726a8707f2252844984";
async function loadNFTs(wallet){

const res=await fetch("/nfts?wallet="+wallet);

const data=await res.json();

const gallery=document.getElementById("gallery");

gallery.innerHTML="";

if(!data.nfts || data.nfts.length===0){

gallery.innerHTML="<h3>No NFTs Found</h3>";

return;

}

data.nfts.forEach(nft=>{

gallery.innerHTML += `
<div class="nft-card">
    <img src="${nft.image_url}">
    <h3>${nft.name}</h3>
    <p>#${nft.identifier}</p>
</div>
`;

});

}
const ABI=[
"function balanceOf(address owner)view returns(uint256)"
];

async function verify(){

if(!window.ethereum){

location.href="index.html";

return;

}

const provider=new ethers.providers.Web3Provider(window.ethereum);

const accounts=await provider.listAccounts();

if(accounts.length===0){

location.href="index.html";

return;

}

const wallet=accounts[0];

document.getElementById("wallet").innerHTML=

"Wallet: "+wallet.substring(0,6)+"..."+wallet.slice(-4);

const contract=new ethers.Contract(CONTRACT,ABI,provider);

const balance=await contract.balanceOf(wallet);

if(balance.eq(0)){

location.href="denied.html";

}

}

verify();

</script>

</body>
</html>
