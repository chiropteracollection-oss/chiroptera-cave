
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$CHIRO</title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("assets/background.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#e8d2a3;
}

.card{
width:850px;
max-width:90%;
background:rgba(0,0,0,.60);
border:2px solid #c89a49;
border-radius:18px;
padding:40px;
text-align:center;
box-shadow:0 0 30px rgba(200,154,73,.2);
}

h1{
font-size:48px;
margin-bottom:20px;
}

.status{
font-size:34px;
font-weight:bold;
color:#c89a49;
margin-bottom:25px;
}

p{
font-size:20px;
line-height:1.8;
margin:12px 0;
}

.back-btn{
margin-top:35px;
padding:15px 40px;
background:#c89a49;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.back-btn:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<div class="card">

<h1>🪙 $CHIRO</h1>

<div class="status">
COMING SOON
</div>

<p>
The $CHIRO token has not been launched yet.
</p>

<p>
Stay tuned for the official announcement.
</p>

<p>
The next chapter of the Chiroptera ecosystem is on its way.
</p>

<p style="color:#c89a49;">
Thank you for your patience and support.
</p>

<button class="back-btn" onclick="history.back()">
⬅ Back to Members
</button>

</div>

</body>
</html>
