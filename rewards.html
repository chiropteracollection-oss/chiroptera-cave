
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiroptera Rewards</title>

<style>
body{
margin:0;
background:#0b0b0b;
color:#e8d2a3;
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background-image:url("assets/background.jpg");
background-size:cover;
background-position:center;
}

.card{
width:800px;
max-width:90%;
background:rgba(0,0,0,.65);
border:2px solid #c89a49;
border-radius:18px;
padding:40px;
text-align:center;
}

.reward{
margin:20px 0;
padding:18px;
border:1px solid #c89a49;
border-radius:10px;
font-size:22px;
}
  .back-btn{
margin-top:30px;
padding:15px 40px;
background:#c89a49;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.back-btn:hover{
transform:scale(1.05);
}
</style>

</head>
<body>

<div class="card">

<h1>🎁 Chiroptera Rewards</h1>

<div class="reward">
Exclusive Giveaways
</div>

<div class="reward">
Future Airdrops
</div>

<div class="reward">
DAO Voting Access
</div>

<div class="reward">
Community Events
</div>

<br>

<button class="back-btn" onclick="history.back()">
⬅ Back to Members
</button>

</div>

</body>
</html>
