<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chiroptera DAO</title>

<style>
body{
margin:0;
font-family:Georgia,serif;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url("assets/background.jpg");
background-size:cover;
background-position:center;
color:#e8d2a3;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:900px;
max-width:90%;
background:rgba(0,0,0,.6);
border:2px solid #c89a49;
border-radius:18px;
padding:40px;
text-align:center;
}

.option{
margin:20px 0;
padding:20px;
border:1px solid #c89a49;
border-radius:12px;
font-size:22px;
}

.back-btn{
margin-top:30px;
padding:15px 40px;
background:#c89a49;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>🗳 Chiroptera DAO</h1>

<div class="option">🗳 Community Voting</div>

<div class="option">📜 Governance Proposals</div>

<div class="option">📈 Treasury Updates</div>

<button class="back-btn" onclick="history.back()">
⬅ Back to Members
</button>

</div>

</body>
</html>
